version: '3.8'

services:
  card-mall:
    image: nginx:alpine
    container_name: card-mall
    restart: unless-stopped
    ports:
      - "39527:80"
    volumes:
      # 挂载前端构建产物
      - ./dist:/usr/share/nginx/html:ro
      # 挂载nginx配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai
